<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lật Bài Nhớ 🃏 — KidCoin Game Hub</title>
    <meta name="description"
        content="Rèn luyện trí nhớ và khám phá kiến thức xã hội, khoa học với game Lật bài siêu vui!">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d1a;
            --surface: #141428;
            --surface2: #1e1e3a;
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.3);
            --success: #10b981;
            --error: #ef4444;
            --text: #f1f0ff;
            --text-muted: #8b8aa8;
            --card-back: linear-gradient(135deg, #06b6d4, #3b82f6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Nav links */
        .card.matched {
            animation: matchFade 0.8s forwards;
            pointer-events: none;
        }

        @keyframes matchFade {
            0% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .card.bomb .card-front {
            background: #ef4444 !important;
            border-color: #f87171 !important;
        }

        .star-rating {
            font-size: 1.5rem;
            color: #fbbf24;
            margin: 10px 0;
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .star {
            opacity: 0.3;
            transition: opacity 0.5s;
        }

        .star.filled {
            opacity: 1;
            filter: drop-shadow(0 0 8px #fbbf24);
        }

        .time-warning {
            color: #ef4444 !important;
            animation: pulse-red 0.5s infinite alternate;
        }

        @keyframes pulse-red {
            from {
                transform: scale(1);
                opacity: 1;
            }

            to {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .nav-btn {
            position: fixed;
            top: 20px;
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
            z-index: 100;
            cursor: pointer;
            font-family: inherit;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .back-link {
            left: 20px;
        }

        .menu-link {
            right: 20px;
            display: none;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            position: relative;
            text-align: center;
        }

        /* Menu Selection */
        #menu-selection {
            background: var(--surface);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .menu-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: var(--surface2);
            padding: 5px;
            border-radius: 12px;
            margin: 20px 0;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* Mode & Difficulty Toggles */
        .mode-selection {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-group {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
            gap: 4px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 12px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .mode-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        .mode-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .mode-btn.active::before {
            content: '✨';
            font-size: 0.8rem;
        }

        #game-board {
            position: relative;
            min-height: 400px;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .theme-card {
            background: var(--surface2);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .theme-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            background: rgba(6, 182, 212, 0.1);
        }

        .theme-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .theme-name {
            font-weight: 900;
            font-size: 1rem;
            color: var(--accent);
        }

        .theme-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent);
            color: white;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 900;
        }

        /* Game Board */
        #game-board {
            display: none;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: var(--surface);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            perspective: 1000px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .card {
            aspect-ratio: 3/4;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .card-back {
            background: var(--card-back);
            z-index: 2;
        }

        .card-back::after {
            content: '?';
            font-size: 2.2rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.5);
        }

        .card-front {
            background: var(--surface2);
            transform: rotateY(180deg);
            z-index: 1;
        }

        .card-emoji {
            font-size: 2.2rem;
            margin-bottom: 4px;
        }

        .card-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-align: center;
        }

        .card-front.shadow .card-emoji {
            filter: brightness(0) contrast(1);
            opacity: 0.9;
        }

        .card-front.large-text {
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent);
        }

        #feedback-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface2);
            padding: 12px 24px;
            border-radius: 50px;
            border: 2px solid var(--accent);
            font-weight: 900;
            color: var(--text);
            transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #feedback-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .fact-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .fact-content {
            background: var(--surface);
            padding: 30px;
            border-radius: 24px;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--accent);
        }

        .fact-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .fact-text {
            color: var(--text);
            line-height: 1.5;
            margin-bottom: 25px;
        }

        #end-overlay {
            position: absolute;
            inset: 0;
            background: rgba(13, 13, 26, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 24px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.05);
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .card-emoji {
                font-size: 1.8rem;
            }

            .menu-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <a href="/game" class="nav-btn back-link">← Quay lại</a>
    <button class="nav-btn menu-link" onclick="showMenu()">🧭 Menu</button>

    <div class="game-container">
        <!-- Menu Selection -->
        <div id="menu-selection">
            <h1 class="menu-title">Lật Bài Nhớ 🃏</h1>

            <div class="tabs toggle-group">
                <button class="tab-btn mode-btn active" id="tab-discovery" onclick="switchTab('DISCOVERY')">Khám
                    Phá</button>
                <button class="tab-btn mode-btn" id="tab-learning" onclick="switchTab('LEARNING')">Học Tập</button>
                <button class="tab-btn mode-btn" id="tab-english" onclick="switchTab('ENGLISH')">Tiếng Anh</button>
            </div>

            <div class="theme-grid" id="theme-list"></div>

            <div id="classic-modes-ui" class="mode-selection">
                <p
                    style="font-weight: 800; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;">
                    Độ khó & Chế độ</p>

                <div class="toggle-group">
                    <button class="mode-btn" id="diff-easy" onclick="setDifficulty('EASY')">Dễ</button>
                    <button class="mode-btn active" id="diff-normal" onclick="setDifficulty('NORMAL')">Vừa</button>
                    <button class="mode-btn" id="diff-hard" onclick="setDifficulty('HARD')">Khó</button>
                </div>

                <div class="toggle-group">
                    <button class="mode-btn active" id="mode-classic" onclick="setMode('CLASSIC')">Cơ bản</button>
                    <button class="mode-btn" id="mode-master" onclick="setMode('MASTER')">Master</button>
                </div>
            </div>
        </div>

        <!-- Game Board -->
        <div id="game-board">
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-label">Thời gian</div>
                    <div class="stat-value" id="timer">45</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Lượt lật</div>
                    <div class="stat-value" id="moves">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Tiến trình</div>
                    <div class="stat-value" id="progress">0/0</div>
                </div>
            </div>

            <div class="grid" id="card-grid"></div>

            <div id="end-overlay">
                <h2 id="end-title" style="font-size: 2.5rem; margin-bottom: 10px;">XUẤT SẮC!</h2>
                <div class="star-rating" id="end-stars">
                    <div class="star">⭐</div>
                    <div class="star">⭐</div>
                    <div class="star">⭐</div>
                </div>
                <p id="final-stats" style="font-size: 1.1rem; margin-bottom: 30px; opacity: 0.9;"></p>
                <button class="btn btn-primary" onclick="showMenu()">Tiếp tục học tập</button>
            </div>
        </div>
    </div>

    <div id="feedback-toast">Đỉnh chóp!</div>

    <div class="fact-modal" id="fact-modal" onclick="closeFact()">
        <div class="fact-content" onclick="event.stopPropagation()">
            <div class="fact-title" id="fact-title"></div>
            <p class="fact-text" id="fact-text"></p>
            <button class="btn-primary" onclick="closeFact()">Tiếp tục 🚀</button>
        </div>
    </div>

                    <div class="theme-name">${theme.name}</div>

                card.onclick = () => selectTheme(key);
                themeListEl.appendChild(card);
            });

            if (theme.type === 'CONCEPT') {
                pairsData.forEach(item => {
                    gameData.push({ id: item.id, content: item.valA, type: item.type || 'emoji', filter: item.filterA, side: 'A' });
                    gameData.push({ id: item.id, content: item.valB, type: item.typeB || item.type || 'emoji', filter: item.filterB, side: 'B' });
                });
            } else {
                if (currentGameMode === 'CLASSIC') {
                    pairsData.forEach(item => {
                        gameData.push({ id: item.id, emoji: item.emoji, vn: item.vn, type: 'classic' });
                        gameData.push({ id: item.id, emoji: item.emoji, vn: item.vn, type: 'classic' });
                    });
                } else {
                    pairsData.forEach(item => {
                        gameData.push({ id: item.id, emoji: item.emoji, vn: item.vn, type: 'master_img' });
                        gameData.push({ id: item.id, vn: item.vn, en: item.en, type: 'master_text' });
                    });
                }
            }

            if (currentDifficulty === 'HARD') {
                gameData.push({ id: 'BOMB', content: '💣', type: 'emoji', isBomb: true });
                gameData.push({ id: 'BOMB', content: '💣', type: 'emoji', isBomb: true });
            }

            gameData.sort(() => Math.random() - 0.5);

            gridEl.innerHTML = '';
            gridEl.className = 'grid';
            gameData.forEach(data => {
                const card = document.createElement('div');
                card.className = 'card' + (data.isBomb ? ' bomb' : '');
                card.dataset.id = data.id;
                if (data.isBomb) card.dataset.isBomb = "true";

                let contentHTML = '';
                let extraClass = '';

                if (data.type === 'classic') {
                    contentHTML = `<div class="card-emoji">${data.emoji}</div><div class="card-label">${data.vn}</div>`;
                } else if (data.type === 'master_img') {
                    contentHTML = `<div class="card-emoji">${data.emoji}</div>`;
                } else if (data.type === 'master_text') {
                    contentHTML = `<div class="card-label" style="font-size:0.55rem">${data.vn}<br><span style="color:var(--accent)">${data.en}</span></div>`;
                } else if (data.type === 'emoji') {
                    contentHTML = `<div class="card-emoji">${data.content}</div>`;
                    if (data.filter === 'shadow') extraClass = 'shadow';
                } else if (data.type === 'text') {
                    contentHTML = `<div class="card-text-val">${data.content}</div>`;
                    extraClass = 'large-text';
                }

                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front ${extraClass}">${contentHTML}</div>
                `;

                card.onclick = () => flipCard(card);
                gridEl.appendChild(card);
            });
        }

        function flipCard(card) {
            if (!canFlip || isPeeking || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            card.classList.add('flipped');
            flippedCards.push(card);

            if (card.dataset.isBomb === "true") {
                showToast("BÙM! -10 giây 💣");
                timer = Math.max(0, timer - 10);
                setTimeout(() => {
                    card.classList.remove('flipped');
                    flippedCards = flippedCards.filter(c => c !== card);
                }, 1000);
                return;
            }

            if (flippedCards.length === 2) {
                canFlip = false;
                moves++;
                updateStats();
                checkMatch();
            }
        }

        function checkMatch() {
            const [c1, c2] = flippedCards;
            if (c1.dataset.id === c2.dataset.id && c1 !== c2) {
                handleMatch();
            } else {
                handleMismatch();
            }
        }

        function handleMatch() {
            matchedCount++;
            consecutiveMistakes = 0;
            updateStats();

            const now = Date.now();
            if (lastMatchTime && now - lastMatchTime < 3000) {
                timer += 5;
                showToast("COMBO! +5 giây 🔥");
            }
            lastMatchTime = now;

            const [c1, c2] = flippedCards;
            setTimeout(() => {
                c1.classList.add('matched');
                c2.classList.add('matched');
                flippedCards = [];
                canFlip = true;
                showToast(FEEDBACK_WIN[Math.floor(Math.random() * FEEDBACK_WIN.length)]);

                const data = (currentTab === 'DISCOVERY') ? DISCOVERY_THEMES :
                    (currentTab === 'LEARNING') ? LEARNING_THEMES : ENGLISH_THEMES;
                const theme = data[currentTheme];
                const item = theme.pairs.find(p => p.id == c1.dataset.id);
                if (item) showFact(item);

                if (matchedCount === totalPairs) endGame(true);
            }, 500);
        }

        function handleMismatch() {
            consecutiveMistakes++;
            showToast(FEEDBACK_LOSE[Math.floor(Math.random() * FEEDBACK_LOSE.length)]);

            if (currentDifficulty === 'HARD' && consecutiveMistakes >= 3) {
                setTimeout(() => {
                    shuffleUnmatched();
                    consecutiveMistakes = 0;
                    showToast("TRÁO ĐỔI VỊ TRÍ! 🌀");
                }, 1000);
            }

            setTimeout(() => {
                flippedCards.forEach(c => c.classList.remove('flipped'));
                flippedCards = [];
                canFlip = true;
            }, 1000);
        }

        function shuffleUnmatched() {
            const unmatched = Array.from(document.querySelectorAll('.card:not(.matched)'));
            const cardsData = unmatched.map(c => ({
                id: c.dataset.id,
                html: c.innerHTML,
                isBomb: c.dataset.isBomb === "true"
            }));

            cardsData.sort(() => Math.random() - 0.5);

            unmatched.forEach((c, i) => {
                c.dataset.id = cardsData[i].id;
                c.innerHTML = cardsData[i].html;
                if (cardsData[i].isBomb) c.dataset.isBomb = "true";
                else delete c.dataset.isBomb;
                c.className = 'card' + (cardsData[i].isBomb ? ' bomb' : '');
            });
        }

        function updateStats() {
            movesEl.innerText = moves;
            progressEl.innerText = `${matchedCount}/${totalPairs}`;
        }

        function initTimer() {
            clearInterval(timerInterval);
            timerEl.innerText = timer;
            timerEl.classList.remove('time-warning');

            timerInterval = setInterval(() => {
                timer--;
                timerEl.innerText = timer;

                if (timer <= 10) timerEl.classList.add('time-warning');
                if (timer <= 0) {
                    timer = 0;
                    timerEl.innerText = 0;
                    clearInterval(timerInterval);
                    endGame(false);
                }
            }, 1000);
        }

        function showToast(msg) {
            toastEl.innerText = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 1500);
        }

        function showFact(item) {
            let title;
            if (currentTab === 'DISCOVERY') title = `${item.emoji} ${item.vn}`;
            else if (currentTab === 'LEARNING' || currentTab === 'ENGLISH') title = `${item.valA || ''} ↔️ ${item.valB || ''}`;

            factTitle.innerText = title;
            factText.innerText = item.fact;
            factModal.style.display = 'flex';
        }

        function closeFact() { factModal.style.display = 'none'; }

        function endGame(won) {
            clearInterval(timerInterval);
            endOverlay.style.display = 'flex';
            const title = document.getElementById('end-title');
            const stats = document.getElementById('final-stats');
            const starsContainer = document.getElementById('end-stars');

            if (won) {
                title.innerText = "XUẤT SẮC!";
                stats.innerText = `Hoàn thành với ${timer} giây còn lại!`;

                // Calculate stars
                let stars = 1;
                if (timer > 25) stars = 3;
                else if (timer > 10) stars = 2;

                const starDivs = starsContainer.querySelectorAll('.star');
                starDivs.forEach((s, i) => s.classList.toggle('filled', i < stars));
                starsContainer.style.display = 'flex';
            } else {
                title.innerText = "HẾT GIỜ RỒI!";
                stats.innerText = "Đừng bỏ cuộc, hãy thử lại nhé!";
                starsContainer.style.display = 'none';
            }
        }

        // --- INIT ---
        setDifficulty('NORMAL');
        switchTab('DISCOVERY');
    </script>
</body>

</html>
