<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Blast V2 — Cuộc đua 60 giây</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/math_blast_v2.css">
</head>
<body class="mb-v2">
  <div class="mb-shell">
    <header class="mb-topbar">
      <a href="/game/math-blast-v2" class="mb-back">← Trang chủ V2</a>
      <div class="mb-brand">🐦 Cuộc đua 60 giây</div>
      <div class="mb-profile"><span class="mb-avatar">🧒</span><span id="mb-profile-label">…</span></div>
    </header>

    <main class="mb-main">
      <section class="mb-hero" style="padding:8px 0 16px;">
        <h1 style="font-size:1.35rem;-webkit-text-fill-color:#bae6fd;">Cuộc đua 60 giây</h1>
        <p>Trả lời đúng để bay lên 3 nấc · Chuỗi đúng nhân điểm</p>
        <button type="button" id="flappy-start" class="mb-btn mb-btn-flappy" style="margin-top:12px;">▶ Bắt đầu cuộc đua</button>
      </section>

      <div class="mb-flappy-stage" id="flappy-stage">
        <div class="mb-flappy-hud">
          <span class="mb-hud-pill" id="flappy-timer">60s</span>
          <span class="mb-hud-pill" id="flappy-score">Điểm 0</span>
          <span class="mb-hud-pill" id="flappy-combo">Chuỗi x0</span>
          <span class="mb-hud-pill" id="flappy-best">Kỷ lục 0</span>
        </div>
        <div class="mb-ladder-rungs" aria-hidden="true">
          <span class="mb-rung" style="bottom:25%"></span>
          <span class="mb-rung" style="bottom:47%"></span>
          <span class="mb-rung" style="bottom:69%"></span>
        </div>
        <div class="mb-bird" id="flappy-bird" style="bottom:15%">🐤</div>
        <div class="mb-question-bar">
          <div class="mb-question" id="flappy-question">3 + 5 = ?</div>
          <div class="mb-choices" id="flappy-choices"></div>
        </div>
      </div>
    </main>

    {% include "games/math_blast_v2_partials/sku_nav.html" %}
  </div>

  {% include "games/math_blast_v2_auth_include.html" %}
  <script src="/static/js/math_blast_v2/common.js?v=20260519"></script>
  <script src="/static/js/math_blast_v2/question_generator.js?v=20260520"></script>
  <script src="/static/js/math_blast_v2/flappy.js?v=20260520"></script>
</body>
</html>
