<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — KidCoin</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; }
        .login-card { background: #1e293b; border-radius: 16px; padding: 2rem; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
        .login-card h1 { color: #f8fafc; font-size: 1.5rem; margin-bottom: .25rem; }
        .login-card p { color: #94a3b8; font-size: .875rem; margin-bottom: 1.5rem; }
        .login-card label { display: block; color: #cbd5e1; font-size: .8rem; margin-bottom: .35rem; }
        .login-card input { width: 100%; padding: .75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; margin-bottom: 1rem; }
        .login-card button { width: 100%; padding: .85rem; border: none; border-radius: 8px; background: #6366f1; color: #fff; font-weight: 700; cursor: pointer; }
        .login-card button:hover { background: #4f46e5; }
        .err { color: #f87171; font-size: .85rem; margin-bottom: .75rem; display: none; }
        .hint { margin-top: 1rem; font-size: .75rem; color: #64748b; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🔐 KidCoin Admin</h1>
        <p>Đăng nhập quản trị — tách biệt với tài khoản bố mẹ/bé.</p>
        <div id="err" class="err"></div>
        <form id="admin-login-form">
            <label for="username">Tên đăng nhập</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Đăng nhập</button>
        </form>
        <p class="hint">Dùng trình duyệt riêng cho admin nếu cùng máy với bé học/game.</p>
    </div>
    <script>
        const nextUrl = {{ next_url | tojson }};
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('err');
            err.style.display = 'none';
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/v1/admin/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password }),
                });
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.detail || 'Sai tài khoản hoặc mật khẩu');
                }
                window.location.href = nextUrl || '/admin';
            } catch (ex) {
                err.textContent = ex.message || 'Đăng nhập thất bại';
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
